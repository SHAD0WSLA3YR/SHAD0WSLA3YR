name: Generate Snake Animation

on:
  # Run every 12 hours for fresher content (was 24)
  schedule:
    - cron: "0 */12 * * *"
  
  # Manual trigger
  workflow_dispatch:
  
  # Run on pushes to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Checkout repo (recommended for newer action versions)
      - name: Checkout
        uses: actions/checkout@v4
      
      # Generate snake with custom colors for better visuals
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00f2ff
            dist/ocean.gif?color_snake=#00f2ff&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39&color_background=#0d1117
      
      # Deploy to output branch with updated action version
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
